name: Build GameZone APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Sync web assets
        run: npx cap sync android

      - name: Inject permissions using Node.js
        run: |
          node -e "
          const fs = require('fs');
          const path = 'android/app/src/main/AndroidManifest.xml';
          let manifest = fs.readFileSync(path, 'utf8');

          if (!manifest.includes('xmlns:tools=\"http://schemas.android.com/tools\"')) {
            manifest = manifest.replace('<manifest ', '<manifest xmlns:tools=\"http://schemas.android.com/tools\" ');
          }

          const permissions = '\n    <!-- Permissions for UsageStats -->\n' +
                              '    <uses-permission android:name=\"android.permission.QUERY_ALL_PACKAGES\" tools:ignore=\"QueryAllPackagesPermission\" />\n' +
                              '    <uses-permission android:name=\"android.permission.PACKAGE_USAGE_STATS\" tools:ignore=\"ProtectedPermissions\" />\n';

          if (!manifest.includes('QUERY_ALL_PACKAGES')) {
            manifest = manifest.replace('<application', permissions + '    <application');
          }

          fs.writeFileSync(path, manifest);
          console.log('✅ Permissoes injetadas com sucesso via Node.js');
          "

      - name: Build Debug APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GameZone-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk