name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with: { node-version: 20 }

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Inject permissions and landscape support (Python Method)
        run: |
          python3 -c "
          import re
          manifest_path = 'android/app/src/main/AndroidManifest.xml'
          with open(manifest_path, 'r') as f:
              content = f.read()
          
          # 1. Adiciona as permissões antes da tag <application>
          permissions = '''<uses-permission android:name=\"android.permission.QUERY_ALL_PACKAGES\" tools:ignore=\"QueryAllPackagesPermission\" />
              <uses-permission android:name=\"android.permission.PACKAGE_USAGE_STATS\" tools:ignore=\"ProtectedPermissions\" />
              <uses-permission android:name=\"android.permission.INTERNET\" />
              <uses-permission android:name=\"android.permission.VIBRATE\" />
              <application'''
          content = content.replace('<application', permissions, 1)
          
          # 2. Adiciona a tag xmlns:tools se não existir
          if 'xmlns:tools' not in content:
              content = content.replace('<manifest', '<manifest xmlns:tools=\"http://schemas.android.com/tools\"', 1)
              
          # 3. Muda a orientação para aceitar paisagem
          content = content.replace('android:screenOrientation=\"portrait\"', 'android:screenOrientation=\"fullSensor\"')
          
          with open(manifest_path, 'w') as f:
              f.write(content)
          "

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build APK (debug)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: central-top-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk