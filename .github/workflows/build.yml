name: Build GameZone APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Sync web assets
        run: npx cap sync android

      - name: Inject permissions using Python
        run: |
          python3 - <<'PY'
          import os
          import xml.etree.ElementTree as ET

          manifest_path = os.path.join('android', 'app', 'src', 'main', 'AndroidManifest.xml')
          if not os.path.exists(manifest_path):
              raise SystemExit(f'Not found: {manifest_path}')

          ET.register_namespace('android', 'http://schemas.android.com/apk/res/android')
          ET.register_namespace('tools', 'http://schemas.android.com/tools')

          tree = ET.parse(manifest_path)
          root = tree.getroot()

          ANDROID_NS = '{http://schemas.android.com/apk/res/android}'
          TOOLS_NS = '{http://schemas.android.com/tools}'

          def ensure_permission(name, ignore_attr):
              for perm in root.findall('uses-permission'):
                  if perm.get(ANDROID_NS + 'name') == name:
                      if ignore_attr:
                          perm.set(TOOLS_NS + 'ignore', ignore_attr)
                      return
              perm = ET.SubElement(root, 'uses-permission')
              perm.set(ANDROID_NS + 'name', name)
              if ignore_attr:
                  perm.set(TOOLS_NS + 'ignore', ignore_attr)

          ensure_permission('android.permission.QUERY_ALL_PACKAGES', 'QueryAllPackagesPermission')
          ensure_permission('android.permission.PACKAGE_USAGE_STATS', 'ProtectedPermissions')

          if 'xmlns:tools' not in (root.get('xmlns:tools') or ''):
              root.set('xmlns:tools', 'http://schemas.android.com/tools')

          tree.write(manifest_path, encoding='utf-8', xml_declaration=True)
          print('Permissions injected OK')
          PY

      - name: Build Debug APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GameZone-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk