name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with: { node-version: 20 }

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Inject permissions and landscape support
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          # Permissões
          sed -i 's|<application|<uses-permission android:name="android.permission.QUERY_ALL_PACKAGES" tools:ignore="QueryAllPackagesPermission" />\n    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.VIBRATE" />\n    <application|' $MANIFEST
          sed -i 's|<manifest |<manifest xmlns:tools="http://schemas.android.com/tools" |' $MANIFEST
          # Suporte a retrato + paisagem (fullSensor)
          sed -i 's|android:screenOrientation="portrait"|android:screenOrientation="fullSensor"|' $MANIFEST
          sed -i 's|android:configChanges="orientation|screenSize"|android:configChanges="orientation|screenSize|keyboardHidden"|' $MANIFEST

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build APK (debug)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: central-top-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk