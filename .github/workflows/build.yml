name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Add Android platform
        run: npx cap add android || true

      - name: Inject AndroidManifest permissions & queries
        run: |
          node -e "
          const fs = require('fs');
          const path = 'android/app/src/main/AndroidManifest.xml';
          let xml = fs.readFileSync(path, 'utf8');

          // Permissões
          const perms = [
            '<uses-permission android:name=\"android.permission.QUERY_ALL_PACKAGES\" tools:ignore=\"QueryAllPackagesPermission\" />',
            '<uses-permission android:name=\"android.permission.PACKAGE_USAGE_STATS\" tools:ignore=\"ProtectedPermissions\" />'
          ];
          for (const p of perms) {
            if (!xml.includes(p)) {
              xml = xml.replace('</manifest>', '  ' + p + '\n</manifest>');
            }
          }

          // Queries para AppLauncher (Android 11+)
          const queries = [
            'com.android.chrome',
            'org.mozilla.firefox',
            'com.microsoft.emmx',
            'com.brave.browser',
            'com.opera.browser',
            'com.roblox.client',
            'com.mojang.minecraftpe',
            'com.innersloth.spacemafia',
            'com.supercell.clashofclans',
            'com.supercell.clashroyale',
            'com.mojang.minecraftpe'
          ];
          const queryBlock = '<queries>\n' + queries.map(p => '  <package android:name=\"' + p + '\" />').join('\n') + '\n</queries>';
          if (!xml.includes('<queries>')) {
            xml = xml.replace('</manifest>', '  ' + queryBlock + '\n</manifest>');
          }

          fs.writeFileSync(path, xml);
          console.log('✅ AndroidManifest.xml atualizado');
          "

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug