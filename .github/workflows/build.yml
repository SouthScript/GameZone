name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Clean & add Android platform
        run: |
          rm -rf android
          npx cap add android

      - name: Inject AndroidManifest permissions & queries
        run: |
          node << 'NODE_EOF'
          const fs = require('fs');
          const path = 'android/app/src/main/AndroidManifest.xml';
          let xml = fs.readFileSync(path, 'utf8');

          console.log('--- BEFORE ---');
          console.log(xml);

          // 1. Garante o namespace xmlns:tools no <manifest>
          if (!xml.includes('xmlns:tools=')) {
            xml = xml.replace(
              /<manifest(\s|>)/,
              '<manifest xmlns:tools="http://schemas.android.com/tools"$1'
            );
          }

          // 2. Permissões
          const perms = [
            'android.permission.QUERY_ALL_PACKAGES',
            'android.permission.PACKAGE_USAGE_STATS'
          ];
          for (const perm of perms) {
            if (!xml.includes('android:name="' + perm + '"')) {
              xml = xml.replace(
                '</manifest>',
                '    <uses-permission android:name="' + perm + '" tools:ignore="QueryAllPackagesPermission,ProtectedPermissions" />\n</manifest>'
              );
            }
          }

          // 3. Queries (Android 11+)
          if (!xml.includes('<queries>')) {
            const queryPkgs = [
              'com.android.chrome', 'org.mozilla.firefox',
              'com.microsoft.emmx', 'com.brave.browser',
              'com.opera.browser', 'com.opera.mini.native',
              'com.sec.android.app.sbrowser',
              'com.roblox.client', 'com.mojang.minecraftpe',
              'com.innersloth.spacemafia',
              'com.supercell.clashofclans', 'com.supercell.clashroyale'
            ];
            const q = '    <queries>\n' +
              queryPkgs.map(p => '        <package android:name="' + p + '" />').join('\n') +
              '\n    </queries>\n';
            xml = xml.replace('</manifest>', q + '</manifest>');
          }

          fs.writeFileSync(path, xml);

          console.log('--- AFTER ---');
          console.log(xml);
          NODE_EOF

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: gamezone-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk